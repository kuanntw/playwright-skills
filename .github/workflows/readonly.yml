name: readonly-regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local_regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Only isolated loopback mock servers, never user accounts or live services.
      - run: npm test
      - name: Preserve reports even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-results
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
